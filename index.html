<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin The Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f7ff;
    --surface2: #f0effe;
    --accent: #6c47ff;
    --accent2: #ff6b6b;
    --accent3: #ffd93d;
    --text: #1a1a2e;
    --text2: #5a5a7a;
    --shadow: rgba(108,71,255,0.15);
    --spin-btn: linear-gradient(135deg, #6c47ff 0%, #a855f7 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 28px 20px 16px;
    position: relative;
    z-index: 2;
  }
  header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    background: linear-gradient(135deg, #6c47ff, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  header p {
    color: var(--text2);
    font-size: 1rem;
    margin-top: 4px;
    font-weight: 600;
  }
  .header-sparkles {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: floatSpark 4s ease-in-out infinite;
  }

  /* ── LAYOUT ── */
  .app-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 0 20px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── CONTROLS BAR ── */
  .controls-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--surface);
    border: 1.5px solid #e8e4ff;
    border-radius: 20px;
    padding: 12px 20px;
    width: 100%;
    max-width: 780px;
  }
  .controls-bar label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .wheel-type-tabs {
    display: flex;
    gap: 6px;
    background: #e8e4ff;
    border-radius: 12px;
    padding: 4px;
  }
  .wheel-type-tabs button {
    padding: 6px 14px;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--text2);
  }
  .wheel-type-tabs button.active {
    background: white;
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(108,71,255,0.2);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-small {
    padding: 6px 14px;
    border-radius: 10px;
    border: 1.5px solid #d4ccff;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-small:hover { background: var(--surface2); border-color: var(--accent); }
  select.btn-small {
    padding-right: 10px;
    appearance: none;
    cursor: pointer;
  }

  /* ── MAIN STAGE ── */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 900px;
  }

  /* ── WHEEL WRAPPER ── */
  .wheel-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .wheel-outer-ring {
    position: absolute;
    border-radius: 50%;
    background: conic-gradient(
      #6c47ff, #a855f7, #ec4899, #f97316, #fbbf24,
      #84cc16, #22d3ee, #6c47ff
    );
    animation: ringRotate 8s linear infinite;
    box-shadow: 0 0 40px rgba(108,71,255,0.3);
  }
  @keyframes ringRotate { to { transform: rotate(360deg); } }
  .wheel-border {
    position: absolute;
    border-radius: 50%;
    background: white;
  }
  #wheelCanvas {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    display: block;
    cursor: pointer;
    transition: filter 0.3s;
  }
  #wheelCanvas:hover { filter: brightness(1.04); }
  .wheel-center-cap {
    position: absolute;
    z-index: 10;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    border: 3px solid #e8e4ff;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .wheel-center-cap:hover { transform: scale(1.05); }
  .wheel-center-cap span {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    color: var(--accent);
    font-size: 0.85rem;
    text-align: center;
    line-height: 1.1;
    user-select: none;
  }
  /* Pointer arrow */
  .wheel-pointer {
    position: absolute;
    right: -22px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
  }

  /* ── SPIN BUTTON ── */
  .spin-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #spinBtn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: var(--spin-btn);
    color: white;
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(108,71,255,0.45), 0 0 0 8px rgba(108,71,255,0.1);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
  }
  #spinBtn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 60%);
    transform: rotate(-30deg);
    pointer-events: none;
  }
  #spinBtn:hover:not(:disabled) {
    transform: scale(1.07);
    box-shadow: 0 12px 40px rgba(108,71,255,0.55), 0 0 0 12px rgba(108,71,255,0.08);
  }
  #spinBtn:active:not(:disabled) { transform: scale(0.96); }
  #spinBtn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .result-display {
    min-height: 56px;
    text-align: center;
    padding: 10px 20px;
    border-radius: 16px;
    background: var(--surface);
    border: 1.5px solid #e8e4ff;
    min-width: 200px;
    transition: all 0.4s;
  }
  .result-display.has-result {
    background: linear-gradient(135deg, #f0effe, #fff0f6);
    border-color: var(--accent);
  }
  .result-display .result-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .result-display .result-name {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.2;
    margin-top: 2px;
  }

  /* ── ITEMS PANEL ── */
  .items-panel {
    background: var(--surface);
    border: 1.5px solid #e8e4ff;
    border-radius: 24px;
    padding: 20px;
    width: 100%;
    max-width: 780px;
  }
  .items-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .items-panel-header h3 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .items-panel-header h3 span {
    font-size: 0.85rem;
    color: var(--text2);
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
  }
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .item-card {
    background: white;
    border: 1.5px solid #e8e4ff;
    border-radius: 16px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    transition: all 0.2s;
    cursor: pointer;
  }
  .item-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px var(--shadow); }
  .item-card.active-result {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: 0 4px 20px var(--shadow);
  }
  .item-img-wrap {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .item-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }
  .item-img-placeholder {
    font-size: 2rem;
    opacity: 0.4;
  }
  .item-img-wrap .upload-overlay {
    position: absolute;
    inset: 0;
    background: rgba(108,71,255,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.4rem;
  }
  .item-card:hover .upload-overlay { opacity: 1; }
  .item-img-wrap input[type="file"] {
    display: none;
  }
  .item-name-input {
    width: 100%;
    border: 1.5px solid #e8e4ff;
    border-radius: 8px;
    padding: 4px 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.2s;
    outline: none;
  }
  .item-name-input:focus { border-color: var(--accent); }
  .item-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .item-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: #ff6b6b;
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    line-height: 1;
  }
  .item-card:hover .item-remove { opacity: 1; }
  .add-item-card {
    background: white;
    border: 2px dashed #d4ccff;
    border-radius: 16px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 130px;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
  }
  .add-item-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
  .add-item-card .plus { font-size: 1.8rem; line-height: 1; }

  /* ── SPIN HISTORY ── */
  .history-section {
    width: 100%;
    max-width: 780px;
  }
  .history-section h3 {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 10px;
  }
  .history-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-chip {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
    color: white;
    animation: chipPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes chipPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ── CELEBRATION OVERLAY ── */
  #celebrationOverlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #celebrationOverlay.visible {
    opacity: 1;
    pointer-events: all;
  }
  .celebration-card {
    background: white;
    border-radius: 32px;
    padding: 40px 48px;
    text-align: center;
    position: relative;
    max-width: 420px;
    width: 90%;
    transform: scale(0.6) translateY(40px);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  #celebrationOverlay.visible .celebration-card { transform: scale(1) translateY(0); }
  .celebration-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #6c47ff, #ec4899, #f97316, #fbbf24, #22d3ee, #6c47ff);
    background-size: 200%;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .celebration-emoji-big {
    font-size: 4rem;
    margin-bottom: 8px;
    animation: emojiPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
  }
  @keyframes emojiPop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
  .celebration-image {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 20px;
    margin: 8px auto 16px;
    display: block;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    animation: imgFloat 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both;
  }
  @keyframes imgFloat { from { transform: scale(0.4) translateY(30px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .celebration-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .celebration-name {
    font-family: 'Baloo 2', cursive;
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .celebration-tagline {
    font-size: 1rem;
    color: var(--text2);
    font-weight: 600;
    margin-bottom: 24px;
  }
  .celebration-close {
    padding: 12px 32px;
    border-radius: 16px;
    border: none;
    background: var(--spin-btn);
    color: white;
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(108,71,255,0.35);
    letter-spacing: 0.5px;
  }
  .celebration-close:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(108,71,255,0.45); }

  /* ── CONFETTI ── */
  .confetto {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    top: -20px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 1001;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ── SPIN ANIMATION ── */
  @keyframes wheelSpin {
    to { transform: rotate(var(--spin-end)); }
  }
  #wheelCanvas.spinning {
    animation: wheelSpin var(--spin-duration) cubic-bezier(0.17, 0.67, 0.12, 1.0) forwards;
  }

  /* ── FLOAT SPARKS ── */
  @keyframes floatSpark {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { transform: translateY(-20px) scale(1.5); opacity: 1; }
  }

  /* ── SOUND TOGGLE ── */
  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text2);
    user-select: none;
  }
  .sound-toggle input { display: none; }
  .toggle-pill {
    width: 36px;
    height: 20px;
    background: #d4ccff;
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-pill::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    top: 3px;
    left: 3px;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .sound-toggle input:checked + .toggle-pill { background: var(--accent); }
  .sound-toggle input:checked + .toggle-pill::after { left: 19px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .stage { gap: 24px; }
    #spinBtn { width: 90px; height: 90px; font-size: 0.95rem; }
  }

  /* ── WHEEL TICK ANIMATION ── */
  .pointer-bounce {
    animation: pointerBounce 0.08s ease-in-out;
  }
  @keyframes pointerBounce {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.15) rotate(-5deg); }
  }
</style>
</head>
<body>

<header>
  <div class="header-sparkles" id="headerSparkles"></div>
  <h1>🎡 Spin The Wheel</h1>
  <p>Tap a slice to edit • Upload your images • Spin to discover!</p>
</header>

<div class="app-container">

  <!-- Controls Bar -->
  <div class="controls-bar">
    <label>Wheel Type</label>
    <div class="wheel-type-tabs">
      <button class="active" data-type="classic" onclick="setWheelType('classic',this)">Classic</button>
      <button data-type="neon" onclick="setWheelType('neon',this)">Neon</button>
      <button data-type="pastel" onclick="setWheelType('pastel',this)">Pastel</button>
      <button data-type="gold" onclick="setWheelType('gold',this)">Gold</button>
    </div>
    <div class="control-group">
      <label>Speed</label>
      <select class="btn-small" id="speedSelect">
        <option value="3000">Slow</option>
        <option value="5000" selected>Normal</option>
        <option value="7500">Fast</option>
        <option value="10000">Turbo</option>
      </select>
    </div>
    <label class="sound-toggle">
      <input type="checkbox" id="soundToggle" checked>
      <span class="toggle-pill"></span>
      🔊 Sound
    </label>
    <button class="btn-small" onclick="resetHistory()">Clear History</button>
  </div>

  <!-- Main Stage -->
  <div class="stage">
    <div class="wheel-wrapper" id="wheelWrapper">
      <div class="wheel-outer-ring" id="outerRing"></div>
      <div class="wheel-border" id="wheelBorder"></div>
      <canvas id="wheelCanvas"></canvas>
      <div class="wheel-center-cap" id="centerCap" onclick="startSpin()">
        <span>SPIN!</span>
      </div>
      <div class="wheel-pointer" id="wheelPointer">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <polygon points="0,22 30,10 30,34" fill="#6c47ff" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="30" cy="22" r="7" fill="#6c47ff" stroke="white" stroke-width="2.5"/>
        </svg>
      </div>
    </div>

    <div class="spin-section">
      <button id="spinBtn" onclick="startSpin()">SPIN!</button>
      <div class="result-display" id="resultDisplay">
        <div class="result-label">Result</div>
        <div class="result-name" id="resultName">—</div>
      </div>
    </div>
  </div>

  <!-- Items Panel -->
  <div class="items-panel">
    <div class="items-panel-header">
      <h3>Wheel Items <span id="itemCountLabel">(8 items)</span></h3>
      <div style="display:flex;gap:8px;">
        <button class="btn-small" onclick="shuffleItems()">🔀 Shuffle</button>
        <button class="btn-small" onclick="addItem()">+ Add Item</button>
      </div>
    </div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <!-- Spin History -->
  <div class="history-section">
    <h3>Spin History</h3>
    <div class="history-chips" id="historyChips">
      <span style="font-size:0.85rem;color:var(--text2);font-weight:600;">No spins yet — give it a whirl! 🎡</span>
    </div>
  </div>
</div>

<!-- Celebration Overlay -->
<div id="celebrationOverlay" onclick="closeCelebration(event)">
  <div class="celebration-card" id="celebrationCard">
    <div class="celebration-emoji-big" id="celebEmoji">🎉</div>
    <img src="" alt="Result" id="celebImage" class="celebration-image" style="display:none;">
    <div class="celebration-title">The Wheel Has Spoken!</div>
    <div class="celebration-name" id="celebName">Pizza</div>
    <div class="celebration-tagline" id="celebTagline">Enjoy your pick! 🎊</div>
    <button class="celebration-close" onclick="closeCelebration(null)">Awesome! ✨</button>
  </div>
</div>

<script>
// ───────────────────────────────────────────
//  DATA & STATE
// ───────────────────────────────────────────
const WHEEL_THEMES = {
  classic: {
    colors: ['#6c47ff','#a855f7','#ec4899','#f97316','#fbbf24','#22d3ee','#84cc16','#ff6b6b','#14b8a6','#8b5cf6','#f59e0b','#10b981'],
    strokeColor: 'white',
    strokeWidth: 3,
    textColor: 'white',
    textShadow: true
  },
  neon: {
    colors: ['#0d0d0d','#1a0033','#0d0033','#001a33','#00331a','#330d00','#33001a','#1a3300'],
    strokeColor: '#00ffff',
    strokeWidth: 2,
    textColor: '#ffffff',
    textShadow: false,
    glowColor: true
  },
  pastel: {
    colors: ['#fce4ec','#e8eaf6','#e0f2f1','#fff9c4','#f3e5f5','#e1f5fe','#f1f8e9','#fce4ec','#ede7f6','#e8f5e9','#fff3e0','#fafafa'],
    strokeColor: 'rgba(0,0,0,0.08)',
    strokeWidth: 2,
    textColor: '#444',
    textShadow: false
  },
  gold: {
    colors: ['#b8860b','#d4a017','#f0c040','#c8961c','#e8b830','#a07810','#daa520','#c89418','#f4d03f','#b7950b','#e5b830','#cd9b1d'],
    strokeColor: '#fff8dc',
    strokeWidth: 3,
    textColor: 'white',
    textShadow: true
  }
};

let currentTheme = 'classic';
let isSpinning = false;
let spinHistory = [];

let items = [
  { id:1, name:'Pizza',      color:0, image:'/images/pizza.png', emoji:'🍕' },
  { id:2, name:'Burger',     color:1, image:null, emoji:'🍔' },
  { id:3, name:'Sushi',      color:2, image:null, emoji:'🍣' },
  { id:4, name:'Tacos',      color:3, image:null, emoji:'🌮' },
  { id:5, name:'Ice Cream',  color:4, image:null, emoji:'🍦' },
  { id:6, name:'Ramen',      color:5, image:null, emoji:'🍜' },
  { id:7, name:'Donuts',     color:6, image:null, emoji:'🍩' },
  { id:8, name:'Pasta',      color:7, image:null, emoji:'🍝' },
];
let nextId = 9;

// ───────────────────────────────────────────
//  CANVAS SETUP
// ───────────────────────────────────────────
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

function initSizes() {
  const s = Math.min(window.innerWidth * 0.88, 420);
  canvas.width = s;
  canvas.height = s;
  const ring = document.getElementById('outerRing');
  ring.style.width = (s + 30) + 'px';
  ring.style.height = (s + 30) + 'px';
  const border = document.getElementById('wheelBorder');
  border.style.width = (s + 18) + 'px';
  border.style.height = (s + 18) + 'px';
  const cap = document.getElementById('centerCap');
  const capSize = Math.max(54, s * 0.14);
  cap.style.width = capSize + 'px';
  cap.style.height = capSize + 'px';
  const ptr = document.getElementById('wheelPointer');
  ptr.style.right = (-s * 0.06 - 22) + 'px';
}
initSizes();

// ───────────────────────────────────────────
//  DRAW WHEEL
// ───────────────────────────────────────────
// wheelAngleRad: cumulative rotation in radians, used directly
function drawWheel(wheelAngleRad) {
  const s = canvas.width;
  const r = s / 2;
  ctx.clearRect(0, 0, s, s);
  ctx.save();
  ctx.translate(r, r);
  ctx.rotate(wheelAngleRad || 0);

  const n = items.length;
  const sliceAngle = (2 * Math.PI) / n;
  const theme = WHEEL_THEMES[currentTheme];

  for (let i = 0; i < n; i++) {
    const start = i * sliceAngle - Math.PI / 2;
    const end = start + sliceAngle;
    const color = theme.colors[i % theme.colors.length];
    const midAngle = start + sliceAngle / 2;

    // Slice fill
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r - 4, start, end);
    ctx.closePath();

    if (currentTheme === 'neon') {
      ctx.fillStyle = color;
      ctx.fill();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = theme.strokeColor;
      ctx.lineWidth = theme.strokeWidth;
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = theme.strokeColor;
      ctx.lineWidth = theme.strokeWidth;
      ctx.stroke();
    }

    // Inner lighter arc for pastel style
    if (currentTheme === 'pastel') {
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.85, start, end);
      ctx.arc(0, 0, r * 0.6, end, start, true);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
    }

    const item = items[i];

    // ── IMAGE / EMOJI  (outer zone: 55%–85% of radius) ──
    const imgR = r * 0.70;
    const imgX = Math.cos(midAngle) * imgR;
    const imgY = Math.sin(midAngle) * imgR;
    const imgSize = Math.min(sliceAngle * r * 0.52, r * 0.28);

    if (item.image) {
      ctx.save();
      ctx.translate(imgX, imgY);
      ctx.rotate(midAngle + Math.PI / 2);
      const hw = imgSize * 0.9;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(-hw / 2, -hw / 2, hw, hw, hw * 0.2);
      } else {
        ctx.rect(-hw / 2, -hw / 2, hw, hw);
      }
      ctx.clip();
      ctx.drawImage(item.image, -hw / 2, -hw / 2, hw, hw);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(imgX, imgY);
      ctx.rotate(midAngle + Math.PI / 2);
      ctx.font = `${Math.max(14, imgSize * 0.85)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.emoji || '❓', 0, 0);
      ctx.restore();
    }

    // ── LABEL TEXT  (inner zone: ~38% of radius) ──
    const textR = r * 0.38;
    const textX = Math.cos(midAngle) * textR;
    const textY = Math.sin(midAngle) * textR;
    ctx.save();
    ctx.translate(textX, textY);
    ctx.rotate(midAngle + Math.PI / 2);
    const fontSize = Math.max(10, Math.min(15, (r * sliceAngle) / (item.name.length * 1.1)));
    ctx.font = `bold ${fontSize}px 'Nunito', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (theme.textShadow) {
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
    }
    ctx.fillStyle = theme.textColor;
    ctx.fillText(item.name.length > 9 ? item.name.slice(0, 8) + '…' : item.name, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Center cap mask
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.14, 0, Math.PI * 2);
  ctx.fillStyle = 'white';
  ctx.fill();

  ctx.restore();
}

// ───────────────────────────────────────────
//  SPIN LOGIC  (single clean implementation)
// ───────────────────────────────────────────
let spinStartTime = null;
let spinDuration = 5000;
let totalSpinRad = 0;       // total radians to spin this session
let wheelOffsetRad = 0;     // accumulated wheel rotation in radians
let lastCrossing = 0;
let spinRafId = null;

function startSpin() {
  if (isSpinning || items.length < 2) return;
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultDisplay').classList.remove('has-result');
  document.getElementById('resultName').textContent = '…';

  spinDuration = parseInt(document.getElementById('speedSelect').value);

  const n = items.length;
  const sliceRad = (2 * Math.PI) / n;
  const extraFullSpins = 5 + Math.random() * 5;           // 5-10 full rotations
  const targetIndex = Math.floor(Math.random() * n);
  // land pointer (right side = angle 0) at center of target slice
  // slice i starts at i*sliceRad - PI/2; its center is at i*sliceRad - PI/2 + sliceRad/2
  // We want that center to be at angle 0 (right), so we need to rotate the wheel so that
  // -(targetCenter) lands at 0, meaning wheelAngle = -(i*sliceRad - PI/2 + sliceRad/2) mod 2PI
  const targetCenter = targetIndex * sliceRad - Math.PI / 2 + sliceRad / 2;
  const neededOffset = (2 * Math.PI - (targetCenter % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  const currentMod = ((wheelOffsetRad % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const delta = (neededOffset - currentMod + 2 * Math.PI) % (2 * Math.PI);

  totalSpinRad = extraFullSpins * 2 * Math.PI + delta;

  spinStartTime = null;
  lastCrossing = Math.floor(wheelOffsetRad / sliceRad);
  ensureAudio();
  cancelAnimationFrame(spinRafId);
  spinRafId = requestAnimationFrame(animateSpin);
}

function easeOut(t) {
  return 1 - Math.pow(1 - t, 4);
}

function animateSpin(timestamp) {
  if (!spinStartTime) spinStartTime = timestamp;
  const elapsed = timestamp - spinStartTime;
  const progress = Math.min(elapsed / spinDuration, 1);
  const traveled = easeOut(progress) * totalSpinRad;
  const currentWheelAngle = wheelOffsetRad + traveled;

  // Tick detection
  const n = items.length;
  const sliceRad = (2 * Math.PI) / n;
  const crossing = Math.floor(currentWheelAngle / sliceRad);
  if (crossing !== lastCrossing) {
    const remaining = 1 - progress;
    playTickSound(remaining);
    bouncePointer();
    lastCrossing = crossing;
  }

  drawWheel(currentWheelAngle);

  if (progress < 1) {
    spinRafId = requestAnimationFrame(animateSpin);
  } else {
    wheelOffsetRad = currentWheelAngle;
    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;

    // Determine winner: pointer is at angle 0 (right). After rotation, the slice
    // whose center aligns with angle 0 wins.
    // The wheel has rotated by wheelOffsetRad. Slice i's center in lab frame =
    // i*sliceRad - PI/2 + sliceRad/2 + wheelOffsetRad. Winner = closest to 0 (mod 2PI).
    const finalMod = ((wheelOffsetRad % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    // pointer at 0 means we look for slice whose -center mod 2PI ≈ 0
    // equivalently: (finalMod + center) mod 2PI ≈ 0
    // center of slice i = i*sliceRad - PI/2 + sliceRad/2
    // pointer angle in wheel frame = -finalMod (mod 2PI)
    const pointerInWheel = ((-finalMod) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    // shift by PI/2 because slices start at -PI/2
    const shifted = (pointerInWheel + Math.PI / 2 + 2 * Math.PI) % (2 * Math.PI);
    const winnerIndex = Math.floor(shifted / sliceRad) % n;
    showResult(items[winnerIndex]);
  }
}

document.getElementById('spinBtn').onclick = startSpin;
document.getElementById('centerCap').onclick = startSpin;

// ───────────────────────────────────────────
//  SOUND EFFECTS
// ───────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTickSound(speed = 0.5) {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const freq = 300 + (1 - speed) * 600;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}

function playCelebrationSound() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    ensureAudio();
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = audioCtx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  } catch(e) {}
}

// ───────────────────────────────────────────
//  RESULT & CELEBRATION
// ───────────────────────────────────────────
function showResult(item) {
  // Result bar
  document.getElementById('resultDisplay').classList.add('has-result');
  document.getElementById('resultName').textContent = item.name;

  // Highlight item card
  document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active-result'));
  const card = document.querySelector(`[data-item-id="${item.id}"]`);
  if (card) { card.classList.add('active-result'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  // History
  spinHistory.unshift(item);
  renderHistory();

  // Celebration
  setTimeout(() => showCelebration(item), 500);
}

function showCelebration(item) {
  playCelebrationSound();
  const overlay = document.getElementById('celebrationOverlay');
  document.getElementById('celebName').textContent = item.name;
  document.getElementById('celebTagline').textContent = getTagline(item.name);

  const img = document.getElementById('celebImage');
  if (item.image) {
    img.src = item.image.src;
    img.style.display = 'block';
    document.getElementById('celebEmoji').style.display = 'none';
  } else {
    img.style.display = 'none';
    document.getElementById('celebEmoji').style.display = 'block';
    document.getElementById('celebEmoji').textContent = item.emoji || '🎉';
  }

  // Card accent color
  const theme = WHEEL_THEMES[currentTheme];
  const color = theme.colors[items.indexOf(item) % theme.colors.length];
  document.getElementById('celebName').style.color = color;

  overlay.classList.add('visible');
  launchConfetti();
}

function closeCelebration(e) {
  if (e && e.target !== document.getElementById('celebrationOverlay')) return;
  if (e === null || e.target === document.getElementById('celebrationOverlay')) {
    document.getElementById('celebrationOverlay').classList.remove('visible');
  }
}

function getTagline(name) {
  const tags = ['Enjoy your pick! 🎊', 'The wheel never lies! ✨', 'Delicious choice! 😋', 'Time to enjoy! 🎉', 'Fate has decided! 🎯', 'Bon appétit! 🍽️'];
  return tags[Math.floor(Math.random() * tags.length)];
}

// ───────────────────────────────────────────
//  CONFETTI
// ───────────────────────────────────────────
function launchConfetti() {
  const colors = ['#6c47ff','#ff6b6b','#ffd93d','#22d3ee','#84cc16','#f97316','#ec4899','#a855f7'];
  const shapes = ['rect','circle'];
  for (let i = 0; i < 120; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetto';
      const color = colors[Math.floor(Math.random() * colors.length)];
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      const size = 6 + Math.random() * 10;
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        background: ${color};
        width: ${size}px;
        height: ${size}px;
        border-radius: ${shape === 'circle' ? '50%' : '2px'};
        animation-duration: ${1.5 + Math.random() * 2}s;
        animation-delay: ${Math.random() * 0.5}s;
        transform: rotate(${Math.random() * 360}deg);
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 12);
  }
}

// ───────────────────────────────────────────
//  POINTER BOUNCE
// ───────────────────────────────────────────
function bouncePointer() {
  const ptr = document.getElementById('wheelPointer');
  ptr.classList.remove('pointer-bounce');
  void ptr.offsetWidth;
  ptr.classList.add('pointer-bounce');
  setTimeout(() => ptr.classList.remove('pointer-bounce'), 100);
}

// ───────────────────────────────────────────
//  ITEMS GRID RENDERING
// ───────────────────────────────────────────
function renderItems() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';
  document.getElementById('itemCountLabel').textContent = `(${items.length} item${items.length !== 1 ? 's' : ''})`;

  items.forEach((item, idx) => {
    const theme = WHEEL_THEMES[currentTheme];
    const color = theme.colors[idx % theme.colors.length];

    const card = document.createElement('div');
    card.className = 'item-card';
    card.setAttribute('data-item-id', item.id);

    const imgWrap = document.createElement('div');
    imgWrap.className = 'item-img-wrap';

    if (item.image) {
      const img = document.createElement('img');
      img.src = item.image.src;
      img.alt = item.name;
      imgWrap.appendChild(img);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'item-img-placeholder';
      placeholder.textContent = item.emoji || '❓';
      imgWrap.appendChild(placeholder);
    }

    const overlay = document.createElement('div');
    overlay.className = 'upload-overlay';
    overlay.title = 'Upload image';
    overlay.textContent = '📷';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
    fileInput.onchange = (e) => handleImageUpload(e, item.id);

    overlay.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
    imgWrap.appendChild(overlay);
    imgWrap.appendChild(fileInput);

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'item-name-input';
    nameInput.value = item.name;
    nameInput.maxLength = 20;
    nameInput.onchange = (e) => {
      item.name = e.target.value || item.name;
      drawWheel(wheelOffsetRad);
    };

    const colorDot = document.createElement('div');
    colorDot.className = 'item-color-dot';
    colorDot.style.background = color;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'item-remove';
    removeBtn.innerHTML = '✕';
    removeBtn.title = 'Remove item';
    removeBtn.onclick = (e) => { e.stopPropagation(); removeItem(item.id); };

    card.appendChild(removeBtn);
    card.appendChild(imgWrap);
    card.appendChild(nameInput);
    card.appendChild(colorDot);
    grid.appendChild(card);
  });

  // Add button
  if (items.length < 16) {
    const addCard = document.createElement('div');
    addCard.className = 'add-item-card';
    addCard.innerHTML = '<div class="plus">+</div><span>Add Item</span>';
    addCard.onclick = addItem;
    grid.appendChild(addCard);
  }

  drawWheel(wheelOffsetRad);
}

function handleImageUpload(e, itemId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.image = img;
        renderItems();
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ───────────────────────────────────────────
//  ITEM MANAGEMENT
// ───────────────────────────────────────────
const FOOD_EMOJIS = ['🍕','🍔','🌮','🍜','🍦','🍩','🍣','🍝','🥗','🍱','🥪','🍛','🍲','🥘','🫕'];
const FOOD_NAMES = ['Waffles','Nachos','Falafel','Dim Sum','Curry','BBQ Ribs','Pho','Gyros','Pad Thai','Bruschetta'];

function addItem() {
  if (items.length >= 16) { alert('Maximum 16 items!'); return; }
  const emoji = FOOD_EMOJIS[items.length % FOOD_EMOJIS.length];
  const name = FOOD_NAMES[items.length % FOOD_NAMES.length];
  items.push({ id: nextId++, name, color: items.length, image: null, emoji });
  renderItems();
}

function removeItem(id) {
  if (items.length <= 2) { alert('Minimum 2 items!'); return; }
  items = items.filter(i => i.id !== id);
  renderItems();
}

function shuffleItems() {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  renderItems();
}

// ───────────────────────────────────────────
//  WHEEL TYPE
// ───────────────────────────────────────────
function setWheelType(type, btn) {
  currentTheme = type;
  document.querySelectorAll('.wheel-type-tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (type === 'neon') {
    document.documentElement.style.setProperty('--accent', '#00e5ff');
    document.documentElement.style.setProperty('--spin-btn', 'linear-gradient(135deg, #0d0d0d, #1a0033)');
  } else if (type === 'pastel') {
    document.documentElement.style.setProperty('--accent', '#a855f7');
    document.documentElement.style.setProperty('--spin-btn', 'linear-gradient(135deg, #a855f7, #ec4899)');
  } else if (type === 'gold') {
    document.documentElement.style.setProperty('--accent', '#b8860b');
    document.documentElement.style.setProperty('--spin-btn', 'linear-gradient(135deg, #b8860b, #f0c040)');
  } else {
    document.documentElement.style.setProperty('--accent', '#6c47ff');
    document.documentElement.style.setProperty('--spin-btn', 'linear-gradient(135deg, #6c47ff, #a855f7)');
  }
  renderItems();
}

// ───────────────────────────────────────────
//  HISTORY
// ───────────────────────────────────────────
function renderHistory() {
  const container = document.getElementById('historyChips');
  container.innerHTML = '';
  if (spinHistory.length === 0) {
    container.innerHTML = '<span style="font-size:0.85rem;color:var(--text2);font-weight:600;">No spins yet — give it a whirl! 🎡</span>';
    return;
  }
  const theme = WHEEL_THEMES[currentTheme];
  spinHistory.slice(0, 20).forEach((item, i) => {
    const chip = document.createElement('div');
    chip.className = 'history-chip';
    const color = theme.colors[items.findIndex(it => it.id === item.id) % theme.colors.length] || '#888';
    chip.style.background = color;
    chip.textContent = `${item.emoji || ''} ${item.name}`;
    if (i === 0) chip.style.outline = '2px solid var(--accent)';
    container.appendChild(chip);
  });
}

function resetHistory() {
  spinHistory = [];
  renderHistory();
  document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active-result'));
  document.getElementById('resultDisplay').classList.remove('has-result');
  document.getElementById('resultName').textContent = '—';
}

// ───────────────────────────────────────────
//  HEADER SPARKLES
// ───────────────────────────────────────────
function createSparkles() {
  const container = document.getElementById('headerSparkles');
  const colors = ['#6c47ff','#ff6b6b','#ffd93d','#22d3ee'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 2) + 's';
    s.style.width = s.style.height = (4 + Math.random() * 5) + 'px';
    container.appendChild(s);
  }
}
createSparkles();

// ───────────────────────────────────────────
//  INIT
// ───────────────────────────────────────────
renderItems();
